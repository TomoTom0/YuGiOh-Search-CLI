name = "ygo-search-workers"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ygo-search"
database_id = "placeholder"  # 実際のデプロイ時に置き換え

# Vectorize
[[vectorize]]
binding = "VECTORIZE"
index_name = "ygo-search-vectors"

# Workers AI
[ai]
binding = "AI"

# Build configuration
[build]
command = "cargo install -q worker-build && worker-build --release"

[build.upload]
format = "modules"
dir = "build/worker"
main = "./shim.mjs"

[[build.upload.rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
