[package]
name = "ygo-search-workers"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 正規表現処理
regex = "1"

# Cloudflare Workers（オプショナル）
worker = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
workers = ["worker", "serde", "serde_json", "wasm-bindgen", "console_error_panic_hook"]

[dev-dependencies]

[profile.release]
opt-level = "z"        # サイズ最適化
lto = true             # リンク時最適化
codegen-units = 1      # 単一コード生成ユニット
strip = true           # デバッグシンボル削除
