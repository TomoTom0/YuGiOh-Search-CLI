name = "ygo-search-workers"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ygo-search"
database_id = "placeholder"  # 実際のデプロイ時に置き換え

# Vectorize
[[vectorize]]
binding = "VECTORIZE"
index_name = "ygo-search-vectors"

# Workers AI
[ai]
binding = "AI"

# Build configuration
# TASK-24: worker 0.8 系に合わせ worker-build 0.8 系（^0.8.7）へ更新
[build]
command = "cargo install -q worker-build@^0.8.7 && worker-build --release"
