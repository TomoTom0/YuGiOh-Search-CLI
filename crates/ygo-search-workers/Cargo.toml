[package]
name = "ygo-search-workers"
version = "0.1.0"
edition.workspace = true

[lib]
# rlib は旧 ygo-search-workers rlib 利用者向け互換 re-export 用に経過措置で保持（将来非推奨）
crate-type = ["cdylib", "rlib"]

[dependencies]
# core（純粋ロジック・default feature のみ）
ygo-search = { path = "../ygo-search" }

# Cloudflare Workers（D1 binding を有効化）
worker = { version = "0.4", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
